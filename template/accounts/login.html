{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — Almost Fit</title>
{% comment %} Updated favicon and manifest tags {% endcomment %}
<link rel="icon" type="image/png" sizes="96x96" href="{% static 'img/favicon-96x96.png' %}">
<link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">
<link rel="manifest" href="{% static 'img/site.webmanifest' %}">
<link rel="stylesheet" href="{% static 'Css/main.css' %}">
<link rel="stylesheet" href="{% static 'Css/theme-indigo-violet.css' %}">
<link rel="stylesheet" href="{% static 'Css/auth.css' %}">
</head>
<body class="auth-page">
{% csrf_token %}
<div class="auth-card card">
  <div class="auth-logo">
    <img src="{% static 'img/logo.png' %}" alt="Almost Fit logo" class="logo-image">
    <h1>Welcome Back</h1>
    <p>Sign in to your Almost Fit account</p>
  </div>

  <div class="form-group">
    <label class="form-label">Email Address</label>
    <div class="input-icon-wrap">
      <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email">
    </div>
  </div>

  <div class="form-group">
    <div style="display:flex; justify-content:space-between; align-items:flex-end;">
      <label class="form-label">Password</label>
      <a href="{% url 'password_reset' %}" style="font-size:.85rem; color:var(--teal-light); text-decoration:none;">Forgot Password?</a>
    </div>
    <div class="input-icon-wrap">
      <input type="password" id="password" class="form-control" placeholder="Password" autocomplete="current-password" style="padding-right:4.5rem;">
      <button class="toggle-pass" type="button" onclick="togglePwd('password',this)">Show</button>
    </div>
  </div>

  <p class="error-msg" id="error-msg"></p>

  <button class="btn btn-primary w-full" id="login-btn" onclick="doLogin()" style="margin-top:8px;justify-content:center;gap:10px;">
    <span class="btn-loader" id="btn-loader"></span>
    Sign In
  </button>

  <div class="divider">or</div>

  <div class="auth-footer">
    Don't have an account? <a href="/register/">Create one free →</a>
  </div>
</div>

<script>
function togglePwd(id, btn) {
  const inp = document.getElementById(id);
  inp.type = inp.type === 'password' ? 'text' : 'password';
  btn.textContent = inp.type === 'password' ? 'Show' : 'Hide';
}

async function doLogin() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('error-msg');
  const btn = document.getElementById('login-btn');
  const loader = document.getElementById('btn-loader');

  errEl.style.display = 'none';
  if (!email || !password) { showErr('Please enter email and password.'); return; }

  btn.disabled = true; loader.style.display = 'block';

  try {
    const csrf = document.querySelector('[name=csrfmiddlewaretoken]')?.value ||
      document.cookie.split('; ').find(r=>r.startsWith('csrftoken='))?.split('=')[1]||'';
    const res = await fetch('/api/login/', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-CSRFToken':csrf},
      body:JSON.stringify({email,password})
    });
    const data = await res.json();
    if (res.ok) { 
        const params = new URLSearchParams(window.location.search);
        const nextUrl = params.get('next');
        window.location.href = nextUrl || data.redirect || '/portal/member/'; 
    }
    else { showErr(data.message || 'Login failed.'); }
  } catch(e) { showErr('Network error. Try again.'); }
  finally { btn.disabled = false; loader.style.display = 'none'; }
}

function showErr(msg) {
  const el = document.getElementById('error-msg');
  el.textContent = msg; el.style.display = 'block';
}

document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// Theme
const t = localStorage.getItem('theme')||'dark';
document.documentElement.setAttribute('data-theme', t);
</script>
</body>
</html>
