{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Invalid Link — Almost Fit</title>
<link rel="stylesheet" href="{% static 'Css/main.css' %}">
<link rel="stylesheet" href="{% static 'Css/theme-indigo-violet.css' %}">
<link rel="stylesheet" href="{% static 'Css/auth.css' %}">
</head>
<body class="auth-page">
<div class="auth-card auth-card--status card">
  <div class="auth-status-icon auth-status-icon--muted">!</div>
  <h1>Link invalid</h1>
  <p>{{ message }}</p>
  <div class="auth-actions">
    <a href="{% url 'register' %}" class="btn btn-outline">Back to registration</a>
  </div>
</div>
</body>
</html>
