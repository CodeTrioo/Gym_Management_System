{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Almost Fit — Create Account</title>
  <link rel="icon" type="image/png" sizes="96x96" href="{% static 'img/favicon-96x96.png' %}">
  <link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% static 'img/site.webmanifest' %}">
  <link rel="stylesheet" href="{% static 'Css/main.css' %}">
  <link rel="stylesheet" href="{% static 'Css/theme-indigo-violet.css' %}">
  <link rel="stylesheet" href="{% static 'Css/auth.css' %}">
</head>

<body class="auth-page">
  {% csrf_token %}
  <div class="auth-card card">
    <div class="auth-logo">
      <img src="{% static 'img/logo.png' %}" alt="Almost Fit logo" class="logo-image">
      <h2>Create account</h2>
      <p>Access your member portal and plans</p>
    </div>

    <div class="form-group">
      <label class="form-label">Full Name</label>
      <div class="input-icon-wrap">
        <input type="text" id="full_name" class="form-control" placeholder="Full name">
      </div>
    </div>

    <div class="perks">
      <div class="perk">Personalized diet and workout plans</div>
      <div class="perk">Book sessions with your trainer</div>
      <div class="perk">Track progress over time</div>
    </div>

    <div class="form-group">
      <label class="form-label">Email Address</label>
      <div class="input-icon-wrap">
        <input type="email" id="email" class="form-control" placeholder="you@example.com">
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Password</label>
      <div class="input-icon-wrap">
        <input type="password" id="password" class="form-control" placeholder="Minimum 8 characters"
          oninput="checkStrength(this.value)" style="padding-right:4.5rem;">
        <button class="toggle-pass" type="button" onclick="togglePwd('password',this)">Show</button>
      </div>
      <div class="password-strength" id="strength-bar"></div>
      <div class="strength-text" id="strength-text"></div>
    </div>

    <div class="form-group">
      <label class="form-label">Confirm Password</label>
      <div class="input-icon-wrap">
        <input type="password" id="confirmPassword" class="form-control" placeholder="Confirm password"
          style="padding-right:4.5rem;">
        <button class="toggle-pass" type="button" onclick="togglePwd('confirmPassword',this)">Show</button>
      </div>
    </div>

    <p class="error-msg" id="error-msg"></p>
    <p class="success-msg" id="success-msg"></p>

    <button class="btn btn-primary w-full" id="reg-btn" onclick="doRegister()" style="justify-content:center;gap:10px;">
      <span class="btn-loader" id="btn-loader"></span>
      Create account
    </button>

    <div class="auth-footer">
      Already have an account? <a href="/login/">Sign in →</a>
    </div>
  </div>

  <script>
    function togglePwd(id, btn) {
      const inp = document.getElementById(id);
      inp.type = inp.type === 'password' ? 'text' : 'password';
      btn.textContent = inp.type === 'password' ? 'Show' : 'Hide';
    }

    function checkStrength(val) {
      const bar = document.getElementById('strength-bar');
      const txt = document.getElementById('strength-text');
      if (!val) { bar.style.background = 'var(--border)'; bar.style.width = '0'; txt.textContent = ''; return; }
      let score = 0;
      if (val.length >= 8) score++;
      if (/[A-Z]/.test(val)) score++;
      if (/[0-9]/.test(val)) score++;
      if (/[^A-Za-z0-9]/.test(val)) score++;
      const levels = [
        { w: '25%', c: '#ef4444', l: 'Weak' },
        { w: '50%', c: '#f59e0b', l: 'Fair' },
        { w: '75%', c: '#06b6d4', l: 'Good' },
        { w: '100%', c: '#22c55e', l: 'Strong' }
      ];
      const lvl = levels[score - 1] || levels[0];
      bar.style.width = lvl.w; bar.style.background = lvl.c;
      txt.textContent = lvl.l; txt.style.color = lvl.c;
    }

    async function doRegister() {
      const full_name = document.getElementById('full_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errEl = document.getElementById('error-msg');
      const sucEl = document.getElementById('success-msg');
      const btn = document.getElementById('reg-btn');
      const loader = document.getElementById('btn-loader');

      errEl.style.display = 'none'; sucEl.style.display = 'none';
      if (!full_name) { showErr('Full Name is required.'); return; }
      if (!email) { showErr('Email is required.'); return; }
      if (!password || password.length < 8) { showErr('Password must be at least 8 characters.'); return; }
      if (password !== confirmPassword) { showErr('Passwords do not match.'); return; }

      btn.disabled = true; loader.style.display = 'block';
      try {
        const csrf = document.querySelector('[name=csrfmiddlewaretoken]')?.value ||
          document.cookie.split('; ').find(r => r.startsWith('csrftoken='))?.split('=')[1] || '';
        const res = await fetch('/api/register/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
          body: JSON.stringify({ full_name, email, password, confirmPassword })
        });
        const data = await res.json();
        if (res.ok) {
          sucEl.textContent = data.message; sucEl.style.display = 'block';
          document.getElementById('full_name').value = '';
          document.getElementById('email').value = '';
          document.getElementById('password').value = '';
          document.getElementById('confirmPassword').value = '';
          checkStrength(''); // reset strength bar
        } else {
          showErr(data.message || 'Registration failed.');
        }
      } catch (e) { showErr('Network error. Try again.'); }
      finally { btn.disabled = false; loader.style.display = 'none'; }
    }

    function showErr(msg) {
      const el = document.getElementById('error-msg');
      el.textContent = msg; el.style.display = 'block';
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') doRegister(); });
    const t = localStorage.getItem('theme') || 'dark';
    document.documentElement.setAttribute('data-theme', t);
  </script>
</body>

</html>
