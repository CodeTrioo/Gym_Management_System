{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — Almost Fit</title>
{% comment %} Updated favicon and manifest tags {% endcomment %}
<link rel="icon" type="image/png" sizes="96x96" href="{% static 'img/favicon-96x96.png' %}">
<link rel="icon" type="image/svg+xml" href="{% static 'img/favicon.svg' %}">
<link rel="apple-touch-icon" sizes="180x180" href="{% static 'img/apple-touch-icon.png' %}">
<link rel="manifest" href="{% static 'img/site.webmanifest' %}">
<link rel="stylesheet" href="{% static 'Css/main.css' %}">
<link rel="stylesheet" href="{% static 'Css/theme-indigo-violet.css' %}">
<link rel="stylesheet" href="{% static 'Css/auth.css' %}">
</head>
<body class="auth-page">
<div class="auth-card card">
  <div class="auth-logo">
    <img src="{% static 'img/logo.png' %}" alt="Almost Fit logo" class="logo-image">
    <h1>Reset password</h1>
    <p>Enter your email and we will send you a reset link.</p>
  </div>

  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" name="email" class="form-control" required id="id_email" placeholder="you@example.com">
    </div>

    {% if form.errors %}
    <div class="error-msg" style="display:block;margin-bottom:12px;">{{ form.email.errors }}</div>
    {% endif %}

    <button type="submit" class="btn btn-primary w-full" style="justify-content:center;">Send reset email</button>
  </form>

  <div style="text-align:center;">
    <a href="{% url 'login' %}" class="auth-back-link">← Back to login</a>
  </div>
</div>
</body>
</html>
