{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — GymPro</title>
<link rel="stylesheet" href="{% static 'Css/main.css' %}">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;background:var(--bg-dark);}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 50% 0%,rgba(13,148,136,.18),transparent);pointer-events:none;}
  .auth-card{width:100%;max-width:420px;position:relative;z-index:1;padding:32px 28px;}
  .auth-logo{text-align:center;margin-bottom:24px;}
  .auth-logo h1{font-size:1.8rem;margin-bottom:8px;}
  .auth-logo p{color:var(--text-muted);font-size:.9rem;}
</style>
</head>
<body>
<div class="auth-card card">
  <div class="auth-logo">
    <h1>Reset Password</h1>
    <p>Enter your email address to receive a password reset link.</p>
  </div>
  
  <form method="post">
    {% csrf_token %}
    <div class="form-group">
      <label class="form-label">Email Address</label>
      <input type="email" name="email" class="form-control" required id="id_email" placeholder="you@example.com">
    </div>
    
    {% if form.errors %}
    <div style="color:var(--red); font-size:0.85rem; margin-bottom:12px;">
      {{ form.email.errors }}
    </div>
    {% endif %}

    <button type="submit" class="btn btn-primary w-full" style="justify-content:center;">Send Reset Email</button>
  </form>
  
  <div style="text-align:center; margin-top:20px;">
    <a href="{% url 'login' %}" style="color:var(--text-muted); text-decoration:none; font-size:.9rem;">← Back to login</a>
  </div>
</div>
</body>
</html>
