{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Email Sent — Almost Fit</title>
<link rel="stylesheet" href="{% static 'Css/main.css' %}">
<link rel="stylesheet" href="{% static 'Css/theme-indigo-violet.css' %}">
<link rel="stylesheet" href="{% static 'Css/auth.css' %}">
</head>
<body class="auth-page">
<div class="auth-card auth-card--status card">
  <div class="auth-status-icon">✓</div>
  <h1>Check your inbox</h1>
  <p>If an account exists for that address, we have sent password reset instructions. You should receive them shortly.</p>
  <div class="auth-actions">
    <a href="{% url 'login' %}" class="btn btn-outline">Back to login</a>
  </div>
</div>
</body>
</html>
